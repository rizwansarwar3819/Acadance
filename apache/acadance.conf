<VirtualHost *:80>
 ServerName acadance.local
 DocumentRoot /var/www/acadance/public
 <Directory /var/www/acadance/public>
  Options FollowSymLinks
  AllowOverride All
  Require all granted
  DirectoryIndex index.html
 </Directory>
 ErrorLog ${APACHE_LOG_DIR}/acadance_error.log
 CustomLog ${APACHE_LOG_DIR}/acadance_access.log combined
</VirtualHost>
